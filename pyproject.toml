[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-uq"
version = "0.1.0"
description = "Simple uncertainty quantification package for trustworthy CSI localization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "torch",
  "lightning",
  "plotly",
  "kaleido"
]

[tool.setuptools.packages.find]
include = ["trustworthy_uq*"]
